# New-API-Person Docker Compose Configuration
#
# Quick Start:
#   1. Copy .env.example to .env, then set SESSION_SECRET and REDIS_PASSWORD
#   2. docker compose up -d
#   3. Access at http://localhost:3000
#
# SQLite data is persisted in ./data next to this compose file.
# Runtime logs are persisted in ./logs next to this compose file.
# PostgreSQL is available with:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d

services:
  new-api-person:
    image: walllee/new-api-person:latest
    container_name: new-api-person
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQLITE_PATH: "/data/one-api.db?_pragma=busy_timeout(30000)&_pragma=journal_mode(WAL)&_pragma=synchronous(NORMAL)"
      SQL_MAX_OPEN_CONNS: "1"
      SQL_MAX_IDLE_CONNS: "1"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env before starting}@redis:6379"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env before starting}"
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: new-api-person-node-1
      SESSION_COOKIE_SECURE: "false"
#      SESSION_COOKIE_TRUSTED_URL: "https://example.com,https://admin.example.com"
#      TRUSTED_PROXIES: "172.20.0.0/16"
#      USER_SESSION_ACTIVE_LIMIT: "50"
#      USER_SESSION_ISSUANCE_LIMIT: "100"
#      USER_SESSION_ISSUANCE_WINDOW_SECONDS: "86400"
#      USER_SESSION_REVOKED_RETENTION_DAYS: "7"
#      USER_SESSION_HOURLY_ALERT_THRESHOLD: "5000"
#      LOG_SQL_DSN: "clickhouse://default:${CLICKHOUSE_PASSWORD}@clickhouse:9000/new_api_logs" # Optional: store logs outside SQLite.
#      LOG_SQL_CLICKHOUSE_TTL_DAYS: "30" # Optional: ClickHouse log retention days.
#      STREAMING_TIMEOUT: "300" # Streaming timeout in seconds.
#      RELAY_IDLE_CONN_TIMEOUT: "90" # Relay HTTP client idle keep-alive timeout in seconds.
#      SYNC_FREQUENCY: "60" # Uncomment if regular database syncing is needed.
    depends_on:
      - redis
    networks:
      - new-api-person-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: new-api-person-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env before starting}"]
    networks:
      - new-api-person-network

#  clickhouse:
#    image: clickhouse/clickhouse-server:24.8
#    container_name: new-api-person-clickhouse
#    restart: always
#    environment:
#      CLICKHOUSE_DB: new_api_logs
#      CLICKHOUSE_USER: default
#      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env before starting}
#      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
#    volumes:
#      - ./clickhouse-data:/var/lib/clickhouse
#    networks:
#      - new-api-person-network
#    ports:
#      - "8123:8123"  # HTTP interface, uncomment if you need external access
#      - "9000:9000" # Native interface used by the LOG_SQL_DSN example above.

networks:
  new-api-person-network:
    driver: bridge
